<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMons – Perfekter Start Checkliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Surface colors — Material-konform (#121212-basiert) mit dezentem Purple-Tint */
    --bg: #12121a;
    --surface: #1a1a24;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --border: #2d2d3a;
    --border-done: rgba(74, 222, 128, 0.25);
    /* Text colors — keine pure whites (WCAG/Dark-Mode Research) */
    --text: #d8d8e4;
    --text-dim: #8e8ea8;
    --text-done: #4a4a5e;
    --heading: #f2f2f8;
    /* Accents */
    --accent: #a78bfa;
    --accent2: #c4b5fd;
    --accent-soft: rgba(167, 139, 250, 0.14);
    --green: #4ade80;
    --green-dim: rgba(74, 222, 128, 0.08);
    --amber: #fbbf24;
    --blue: #60a5fa;
    --pink: #f472b6;
    --orange: #fb923c;
    --red: #f87171;
    --detail-bg: rgba(167, 139, 250, 0.05);
    --detail-border: rgba(167, 139, 250, 0.22);
    /* Fonts — Inter für Body (screen-optimized, hohe x-height), Chakra Petch für Display */
    --font-display: 'Chakra Petch', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    /* Base = 16px (WCAG-Empfehlung für Body-Text). Alle rem-Werte basieren darauf. */
    font-size: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;        /* 16px */
    font-weight: 400;
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .header-icon {
    font-size: 2.25rem;     /* 36px */
    filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.35));
    flex-shrink: 0;
  }
  .header-text { flex: 1; min-width: 0; }
  .header h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;     /* 28px */
    font-weight: 700;
    color: var(--heading);
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  .header p {
    font-size: 0.875rem;    /* 14px */
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* Progress */
  .progress-wrap { margin: 18px 0 16px; }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.875rem;    /* 14px */
    margin-bottom: 8px;
  }
  .progress-count { color: var(--text-dim); }
  .progress-pct { font-weight: 700; color: var(--accent2); font-family: var(--font-display); }
  .progress-pct.done { color: var(--green); }
  .progress-bar {
    height: 8px;
    border-radius: 4px;
    background: var(--surface2);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #8b5cf6, var(--accent2));
    transition: width 0.4s ease;
  }
  .progress-fill.done {
    background: linear-gradient(90deg, var(--green), #22d3ee);
  }

  /* Profile Selector */
  .profile-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .profile-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9375rem;   /* 15px */
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .profile-btn:hover { border-color: var(--accent); }
  .profile-btn-icon { font-size: 1.125rem; }
  .profile-btn-label {
    flex: 1;
    text-align: left;
    color: var(--text-dim);
    font-size: 0.75rem;     /* 12px */
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: var(--font-display);
  }
  .profile-btn-name {
    color: var(--heading);
    font-weight: 600;
    font-size: 0.9375rem;
  }
  .profile-btn-arrow {
    color: var(--text-dim);
    font-size: 0.75rem;
    transition: transform 0.2s;
  }
  .profile-btn.open .profile-btn-arrow { transform: rotate(180deg); }

  .profile-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    z-index: 20;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    display: none;
    animation: slideDown 0.15s ease;
  }
  .profile-panel.open { display: block; }
  .profile-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.9375rem;   /* 15px */
    color: var(--text);
    font-family: var(--font-body);
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    transition: background 0.15s;
  }
  .profile-item:hover { background: var(--surface2); }
  .profile-item.active {
    background: var(--accent-soft);
    color: var(--accent2);
    font-weight: 600;
  }
  .profile-item-check {
    width: 16px;
    color: var(--accent2);
    flex-shrink: 0;
  }
  .profile-item-name { flex: 1; }
  .profile-item-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .profile-item:hover .profile-item-delete { opacity: 1; }
  .profile-item-delete:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }
  .profile-divider {
    height: 1px;
    background: var(--border);
    margin: 6px 4px;
  }
  .profile-new-form {
    display: flex;
    gap: 6px;
    padding: 6px;
  }
  .profile-new-input {
    flex: 1;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9375rem;
  }
  .profile-new-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .profile-new-input::placeholder { color: var(--text-dim); }
  .profile-new-save {
    padding: 9px 14px;
    background: var(--accent-soft);
    border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 7px;
    color: var(--accent2);
    font-family: var(--font-display);
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .profile-new-save:hover {
    background: rgba(167, 139, 250, 0.22);
    color: var(--heading);
  }

  /* Path Filter */
  .path-filter {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .path-filter::-webkit-scrollbar { display: none; }
  .path-btn {
    flex: 1;
    min-width: fit-content;
    padding: 10px 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-size: 0.875rem;    /* 14px */
    font-weight: 600;
    border-radius: 7px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .path-btn:hover { color: var(--text); }
  .path-btn.active {
    background: var(--accent-soft);
    color: var(--accent2);
  }
  .path-btn .path-count {
    font-size: 0.75rem;     /* 12px */
    opacity: 0.75;
    margin-left: 5px;
  }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;        /* 16px */
    transition: border-color 0.2s;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1rem;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1.125rem;
    padding: 6px 10px;
    display: none;
    border-radius: 6px;
  }
  .search-clear.show { display: block; }
  .search-clear:hover { color: var(--text); background: var(--surface2); }

  /* Info boxes */
  .info-box {
    margin-bottom: 18px;
    border-radius: 10px;
    padding: 14px 18px;
  }
  .tier-box {
    background: rgba(96, 165, 250, 0.05);
    border: 1px solid rgba(96, 165, 250, 0.14);
  }
  .tier-box h3 {
    font-family: var(--font-display);
    font-size: 0.9375rem;   /* 15px */
    color: var(--blue);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tier-box .tier-row {
    font-size: 0.9375rem;   /* 15px */
    color: var(--text);
    line-height: 2;
  }
  .tier-box .tier-label {
    color: var(--heading);
    font-weight: 600;
  }
  .info-link {
    font-size: 0.8125rem;   /* 13px */
    color: var(--accent2);
    text-decoration: none;
    font-family: var(--font-display);
    font-weight: 600;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .info-link:hover { color: var(--heading); background: var(--accent-soft); }

  /* Part Divider */
  .part-divider {
    margin: 22px 0 12px;
    padding-left: 4px;
  }
  .part-divider .part-label {
    font-family: var(--font-display);
    font-size: 0.75rem;     /* 12px */
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    font-weight: 600;
  }
  .part-divider .part-title {
    font-family: var(--font-display);
    font-size: 1.125rem;    /* 18px */
    color: var(--heading);
    font-weight: 700;
    display: block;
    margin-top: 4px;
  }
  .part-divider.pokemon .part-label { color: var(--pink); }
  .part-divider.tech .part-label { color: var(--blue); }
  .part-divider.endgame .part-label { color: var(--amber); }

  /* Phase */
  .phase {
    margin-bottom: 10px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .phase.done {
    background: var(--green-dim);
    border-color: var(--border-done);
  }

  .phase-header {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 14px 16px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    text-align: left;
    gap: 12px;
    font-family: var(--font-body);
  }
  .phase-icon { font-size: 1.375rem; flex-shrink: 0; }  /* 22px */
  .phase-info { flex: 1; min-width: 0; }
  .phase-title {
    font-family: var(--font-display);
    font-size: 1.0625rem;   /* 17px */
    font-weight: 600;
    color: var(--heading);
    display: block;
    line-height: 1.3;
  }
  .phase.done .phase-title { color: var(--green); }
  .phase-desc {
    font-size: 0.8125rem;   /* 13px */
    color: var(--text-dim);
    display: block;
    margin-top: 4px;
    line-height: 1.5;
  }
  .phase-badge {
    font-size: 0.8125rem;   /* 13px */
    font-weight: 600;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 12px;
    flex-shrink: 0;
    font-family: var(--font-display);
  }
  .phase.done .phase-badge {
    color: var(--green);
    background: rgba(74, 222, 128, 0.12);
  }
  .phase-arrow {
    font-size: 0.75rem;
    color: var(--text-dim);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .phase-arrow.shut { transform: rotate(-90deg); }

  .phase-items { padding: 0 8px 8px; }

  /* Item row */
  .item-row { margin-bottom: 2px; }
  .item-main {
    display: flex;
    align-items: flex-start;
    gap: 0;
    width: 100%;
  }
  .item-check {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    min-height: 40px;
    background: none;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    padding-top: 10px;
  }
  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #3a3a4a;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8125rem;   /* 13px */
    color: var(--bg);
    font-weight: 700;
    transition: all 0.15s;
  }
  .checkbox.on {
    border-color: var(--green);
    background: var(--green);
  }

  .item-text-btn {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 10px 10px 0;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
    border-radius: 6px;
    transition: background 0.1s;
  }
  .item-text-btn:hover { background: rgba(255,255,255,0.025); }

  .item-label {
    font-size: 1rem;        /* 16px — WCAG Body-Text-Minimum */
    line-height: 1.55;
    color: var(--text);
    flex: 1;
    transition: color 0.2s, text-decoration 0.2s;
  }
  .item-label.on {
    color: var(--text-done);
    text-decoration: line-through;
  }
  .item-label mark {
    background: rgba(251, 191, 36, 0.22);
    color: var(--amber);
    padding: 1px 4px;
    border-radius: 3px;
  }

  .item-expand {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 7px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .item-expand.open { transform: rotate(180deg); }

  /* Detail panel */
  .item-detail {
    margin: 0 10px 10px 42px;
    padding: 13px 18px;
    background: var(--detail-bg);
    border-radius: 8px;
    border-left: 3px solid var(--detail-border);
    font-size: 0.9375rem;   /* 15px */
    line-height: 1.75;
    color: var(--text);
    animation: slideDown 0.15s ease;
  }
  .item-detail strong { color: var(--text); font-weight: 600; }
  .item-detail em { color: var(--amber); font-style: normal; font-weight: 600; }
  .item-detail code {
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.8125rem;   /* 13px */
    color: var(--accent2);
    font-family: 'Consolas', 'Cascadia Code', monospace;
  }
  .item-guide-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 13px;
    background: var(--accent-soft);
    border: 1px solid rgba(167, 139, 250, 0.28);
    border-radius: 7px;
    color: var(--accent2);
    font-family: var(--font-display);
    font-size: 0.8125rem;   /* 13px */
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .item-guide-btn:hover {
    background: rgba(167, 139, 250, 0.22);
    border-color: var(--accent);
    color: var(--heading);
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-dim);
    font-size: 1rem;        /* 16px */
  }
  .empty-state-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.4; }

  /* Reset */
  .reset-wrap { text-align: center; margin-top: 24px; }
  .reset-btn {
    padding: 10px 22px;
    font-size: 0.8125rem;   /* 13px */
    font-family: var(--font-body);
    color: var(--text-dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: rgba(248, 113, 113, 0.4);
    color: var(--red);
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.75rem;     /* 12px */
    color: var(--text-dim);
    opacity: 0.5;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 20px 12px;
    overflow-y: auto;
    animation: fadeIn 0.15s ease;
  }
  .modal-overlay.open { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    width: 100%;
    max-width: 680px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin: auto;
    animation: modalSlide 0.2s ease;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }
  @keyframes modalSlide {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .modal-icon {
    font-size: 1.625rem;    /* 26px */
    filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.35));
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 1.25rem;     /* 20px */
    font-weight: 700;
    color: var(--heading);
    flex: 1;
    line-height: 1.3;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.75rem;
    cursor: pointer;
    padding: 4px 10px;
    line-height: 1;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .modal-close:hover { color: var(--red); background: rgba(248, 113, 113, 0.1); }

  .modal-body {
    padding: 24px 28px 28px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    font-size: 1rem;        /* 16px — WCAG Body Minimum */
    line-height: 1.7;
    color: var(--text);
  }
  .modal-body h3 {
    font-family: var(--font-display);
    font-size: 1.0625rem;   /* 17px */
    color: var(--accent2);
    margin: 22px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
  }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body p { margin-bottom: 12px; color: var(--text); }
  .modal-body ul, .modal-body ol {
    margin: 8px 0 14px 22px;
    color: var(--text);
  }
  .modal-body li { margin-bottom: 6px; }
  .modal-body strong { color: var(--heading); font-weight: 600; }
  .modal-body em { color: var(--amber); font-style: normal; font-weight: 600; }
  .modal-body code {
    background: var(--surface3);
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.875rem;    /* 14px */
    color: var(--accent2);
    font-family: 'Consolas', 'Cascadia Code', monospace;
  }
  .modal-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0 18px;

<script>
/* ============================================================
   STATE & RENDERING
   ============================================================ */
const PATHS = [
  { id: "all",     label: "Alles",    icon: "📋" },
  { id: "base",    label: "Basis",    icon: "⚙️" },
  { id: "pokemon", label: "Pokémon",  icon: "🔴" },
  { id: "tech",    label: "Tech",     icon: "⚡" },
  { id: "endgame", label: "Endgame",  icon: "🌟" },
];

/* ============================================================
   STATE — mit Profil-Support (Multi-User im selben Browser)
   ============================================================ */
const STORAGE = {
  meta: 'atmons-checklist-v3:meta',           // { current, list: [...] }
  profile: name => `atmons-checklist-v3:profile:${name}`,
};
const DEFAULT_PROFILE = "Standard";

let state = {
  // Per-Profil State
  checked: {},
  collapsed: {},
  expanded: {},
  path: "all",
  search: "",
  // Globaler UI-State (nicht in localStorage)
  openGuide: null,
  profilePanelOpen: false,
  // Profil-Verwaltung
  currentProfile: DEFAULT_PROFILE,
  profiles: [DEFAULT_PROFILE],
};

function loadMeta() {
  try {
    const raw = localStorage.getItem(STORAGE.meta);
    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d.list) && d.list.length > 0) {
        state.profiles = d.list;
        state.currentProfile = d.current && d.list.includes(d.current) ? d.current : d.list[0];
        return;
      }
    }
  } catch(e) {}
  state.profiles = [DEFAULT_PROFILE];
  state.currentProfile = DEFAULT_PROFILE;
}

function saveMeta() {
  try {
    localStorage.setItem(STORAGE.meta, JSON.stringify({
      current: state.currentProfile,
      list: state.profiles,
    }));
  } catch(e) {}
}

function loadProfile(name) {
  try {
    const raw = localStorage.getItem(STORAGE.profile(name));
    if (raw) {
      const d = JSON.parse(raw);
      state.checked = d.c || {};
      state.collapsed = d.o || {};
      state.path = d.p || "all";
      state.expanded = {};
      return;
    }
  } catch(e) {}
  // Profil existiert nicht → leerer State
  state.checked = {};
  state.collapsed = {};
  state.expanded = {};
  state.path = "all";
}

function saveProfile() {
  try {
    localStorage.setItem(STORAGE.profile(state.currentProfile), JSON.stringify({
      c: state.checked,
      o: state.collapsed,
      p: state.path,
    }));
  } catch(e) {}
}

function migrateFromLegacy() {
  // v2 → v3: importiere alten Single-User-State als "Standard"-Profil
  try {
    const v2 = localStorage.getItem('atmons-checklist-v2');
    if (v2 && !localStorage.getItem(STORAGE.profile(DEFAULT_PROFILE))) {
      const d = JSON.parse(v2);
      localStorage.setItem(STORAGE.profile(DEFAULT_PROFILE), JSON.stringify({
        c: d.c || {},
        o: d.o || {},
        p: d.p || "all",
      }));
      return;
    }
    // v1 → v3
    const v1 = localStorage.getItem('atmons-checklist');
    if (v1 && !localStorage.getItem(STORAGE.profile(DEFAULT_PROFILE))) {
      const d = JSON.parse(v1);
      localStorage.setItem(STORAGE.profile(DEFAULT_PROFILE), JSON.stringify({
        c: d.c || {},
        o: d.o || {},
        p: "all",
      }));
    }
  } catch(e) {}
}

function load() {
  migrateFromLegacy();
  loadMeta();
  loadProfile(state.currentProfile);
}

function save() {
  saveProfile();
  saveMeta();
}

function sanitizeProfileName(name) {
  return (name || "").trim().slice(0, 30);
}

function matchesSearch(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const text = (item.text || "").toLowerCase();
  const detail = (item.detail || "").toLowerCase();
  return text.includes(q) || detail.includes(q);
}

function highlightText(text, query) {
  if (!query) return text;
  const q = query.trim();
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function filteredPhases() {
  return PHASES
    .filter(p => state.path === "all" || p.path === state.path)
    .map(p => ({
      ...p,
      items: p.items.filter(i => matchesSearch(i, state.search))
    }))
    .filter(p => p.items.length > 0);
}

function getPathStats(pathId) {
  let tot = 0, dn = 0;
  PHASES.forEach(p => {
    if (pathId !== "all" && p.path !== pathId) return;
    p.items.forEach(i => {
      tot++;
      if (state.checked[i.id]) dn++;
    });
  });
  return { tot, dn, pc: tot ? Math.round(dn / tot * 100) : 0 };
}

function getPhaseStats(phase) {
  const visible = phase.items;
  const tot = visible.length;
  const dn = visible.filter(i => state.checked[i.id]).length;
  const allTot = PHASES.find(p => p.id === phase.id).items.length;
  const allDn = PHASES.find(p => p.id === phase.id).items.filter(i => state.checked[i.id]).length;
  return { tot, dn, full: allDn === allTot, allTot, allDn };
}

/* Map a phase.id to the label of Teil A/B1/B2/C for section dividers */
function partForPhase(phase) {
  const n = parseInt(phase.id.replace('p', ''), 10);
  if (n <= 3)  return { key: "base",    label: "Teil A",  title: "Grundlagen" };
  if (n <= 8)  return { key: "pokemon", label: "Teil B1", title: "Pokémon-Pfad" };
  if (n <= 15) return { key: "tech",    label: "Teil B2", title: "Tech-Pfad" };
  return { key: "endgame", label: "Teil C", title: "Mittelspiel & Endgame" };
}

function renderProfilePanel() {
  const open = state.profilePanelOpen;
  let html = `
    <div class="profile-wrap">
      <button class="profile-btn ${open ? 'open' : ''}" onclick="toggleProfilePanel(event)">
        <span class="profile-btn-icon">👤</span>
        <span class="profile-btn-label">Profil</span>
        <span class="profile-btn-name">${escapeHtml(state.currentProfile)}</span>
        <span class="profile-btn-arrow">▼</span>
      </button>
      <div class="profile-panel ${open ? 'open' : ''}" onclick="event.stopPropagation()">
  `;
  state.profiles.forEach(name => {
    const isActive = name === state.currentProfile;
    html += `
      <button class="profile-item ${isActive ? 'active' : ''}" onclick="switchProfile('${escapeAttr(name)}')">
        <span class="profile-item-check">${isActive ? '✓' : ''}</span>
        <span class="profile-item-name">${escapeHtml(name)}</span>
        ${state.profiles.length > 1 && !isActive ? `<span class="profile-item-delete" onclick="deleteProfile(event, '${escapeAttr(name)}')" title="Profil löschen">×</span>` : ''}
      </button>
    `;
  });
  html += `
        <div class="profile-divider"></div>
        <form class="profile-new-form" onsubmit="createProfile(event)">
          <input type="text" class="profile-new-input" id="profile-new-input"
            placeholder="+ Neues Profil (Name eingeben)" maxlength="30" autocomplete="off">
          <button type="submit" class="profile-new-save">Anlegen</button>
        </form>
      </div>
    </div>
  `;
  return html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/['"\\]/g, '\\$&');
}

function render() {
  const app = document.getElementById('app');
  const phases = filteredPhases();
  const overall = getPathStats("all");
  const current = getPathStats(state.path);
  const pathInfo = PATHS.find(p => p.id === state.path);
  let html = '';

  // Header
  html = `
    <div class="header">
      <span class="header-icon">📋</span>
      <div class="header-text">
        <h1>ATMons – Perfekter Start</h1>
        <p>Verifiziert aus der lokalen Instanz · Pokémon + Tech parallel · Klicke Items für Details</p>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span class="progress-count">${overall.dn}/${overall.tot} insgesamt${state.path !== "all" ? ` · ${current.dn}/${current.tot} in ${pathInfo.label}` : ""}</span>
        <span class="progress-pct ${overall.pc===100?'done':''}">${overall.pc}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ${overall.pc===100?'done':''}" style="width:${overall.pc}%"></div>
      </div>
    </div>
  `;

  // Profil-Selector
  html += renderProfilePanel();

  // Path Filter
  html += `<div class="path-filter">`;
  PATHS.forEach(p => {
    const s = getPathStats(p.id);
    html += `
      <button class="path-btn ${state.path === p.id ? 'active' : ''}" onclick="setPath('${p.id}')">
        ${p.icon} ${p.label}<span class="path-count">${s.dn}/${s.tot}</span>
      </button>
    `;
  });
  html += `</div>`;

  // Search
  html += `
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-input"
        placeholder="Suchen nach Item, Mod, Begriff..."
        value="${state.search.replace(/"/g, '&quot;')}"
        oninput="setSearch(this.value)">
      <button class="search-clear ${state.search ? 'show' : ''}" onclick="clearSearch()">✕</button>
    </div>
  `;

  // Mining Tiers info box
  if (!state.search && (state.path === "all" || state.path === "base")) {
    html += `
      <div class="info-box tier-box">
        <h3>
          <span>⛏️ Mining-Tiers (verifiziert)</span>
          <span>
            <button class="info-link" onclick="openGuide('mining-tiers')">Tiers →</button>
            <button class="info-link" onclick="openGuide('ore-heights')">Y-Höhen →</button>
          </span>
        </h3>
        <div class="tier-row"><span class="tier-label">Stein:</span> Kohle, Eisen, Kupfer, Tin, Aluminum, Lead</div>
        <div class="tier-row"><span class="tier-label">Eisen:</span> Gold, Redstone, Lapis, Silver, Nickel, Diamant</div>
        <div class="tier-row"><span class="tier-label">Diamant:</span> Platinum, Osmium, Zinc, Uranium, Obsidian</div>
        <div class="tier-row"><span class="tier-label">Netherite:</span> Allthemodium, Vibranium</div>
        <div class="tier-row"><span class="tier-label">Allthemodium:</span> Unobtainium</div>
      </div>
    `;
  }

  // Phases
  if (phases.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-state-icon">🔍</div>
        Keine Einträge gefunden${state.search ? ` für "${state.search}"` : ""}.
      </div>
    `;
  } else {
    let lastPart = null;
    phases.forEach(phase => {
      const ps = getPhaseStats(phase);
      const shut = state.collapsed[phase.id] && !state.search;
      const part = partForPhase(phase);

      // Part divider — only when path == "all" and part changed
      if (state.path === "all" && !state.search && (!lastPart || lastPart.label !== part.label)) {
        html += `
          <div class="part-divider ${part.key}">
            <span class="part-label">${part.label}</span>
            <span class="part-title">${part.title}</span>
          </div>
        `;
        lastPart = part;
      }

      html += `
        <div class="phase ${ps.full ? 'done' : ''}">
          <button class="phase-header" onclick="togglePhase('${phase.id}')">
            <span class="phase-icon">${phase.icon}</span>
            <div class="phase-info">
              <span class="phase-title">${phase.title}</span>
              ${phase.desc ? `<span class="phase-desc">${phase.desc}</span>` : ''}
            </div>
            <span class="phase-badge">${ps.allDn}/${ps.allTot}</span>
            <span class="phase-arrow ${shut ? 'shut' : ''}">▼</span>
          </button>
      `;

      if (!shut) {
        html += `<div class="phase-items">`;
        phase.items.forEach(item => {
          const on = state.checked[item.id];
          const exp = state.expanded[item.id] || (!!state.search && item.detail);
          const labelHtml = state.search ? highlightText(item.text, state.search) : item.text;
          const detailHtml = state.search && item.detail ? highlightText(item.detail, state.search) : item.detail;
          html += `
            <div class="item-row">
              <div class="item-main">
                <button class="item-check" onclick="toggleItem('${item.id}')">
                  <span class="checkbox ${on ? 'on' : ''}">${on ? '✓' : ''}</span>
                </button>
                <button class="item-text-btn" onclick="toggleExpand('${item.id}')">
                  <span class="item-label ${on ? 'on' : ''}">${labelHtml}</span>
                  ${item.detail ? `<span class="item-expand ${exp ? 'open' : ''}">▾</span>` : ''}
                </button>
              </div>
              ${exp && item.detail ? `
                <div class="item-detail">
                  ${detailHtml}
                  ${item.guide ? `<br><button class="item-guide-btn" onclick="openGuide('${item.guide}')">📖 Vollständiger Guide öffnen</button>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>`;
    });
  }

  // Reset
  html += `
    <div class="reset-wrap">
      <button class="reset-btn" onclick="resetAll()">Fortschritt zurücksetzen</button>
    </div>
    <div class="footer">ATMons Checkliste · Daten werden lokal im Browser gespeichert</div>
  `;

  app.innerHTML = html;

  // Restore focus to search input if it was focused
  if (state.searchFocused) {
    const input = document.getElementById('search-input');
    if (input) {
      input.focus();
      const v = input.value;
      input.setSelectionRange(v.length, v.length);
    }
  }

  // Render modal if open
  renderModal();
}

function renderModal() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  if (!state.openGuide || !GUIDES[state.openGuide]) {
    overlay.classList.remove('open');
    modal.innerHTML = "";
    document.body.style.overflow = "";
    return;
  }
  const g = GUIDES[state.openGuide];
  modal.innerHTML = `
    <div class="modal-header">
      <span class="modal-icon">${g.icon}</span>
      <span class="modal-title">${g.title}</span>
      <button class="modal-close" onclick="closeGuide()">×</button>
    </div>
    <div class="modal-body">${g.content}</div>
  `;
  overlay.classList.add('open');
  document.body.style.overflow = "hidden";
}

window.toggleItem = function(id) {
  state.checked[id] = !state.checked[id];
  save();
  render();
};

window.togglePhase = function(id) {
  state.collapsed[id] = !state.collapsed[id];
  save();
  render();
};

window.toggleExpand = function(id) {
  state.expanded[id] = !state.expanded[id];
  render();
};

window.setPath = function(p) {
  state.path = p;
  save();
  render();
};

window.setSearch = function(s) {
  state.search = s;
  state.searchFocused = true;
  render();
  state.searchFocused = false;
};

window.clearSearch = function() {
  state.search = "";
  render();
};

window.openGuide = function(id) {
  state.openGuide = id;
  renderModal();
};

window.closeGuide = function() {
  state.openGuide = null;
  renderModal();
};

window.closeGuideFromOverlay = function(e) {
  if (e.target.id === 'modal-overlay') closeGuide();
};

window.resetAll = function() {
  if (!confirm(`Wirklich ALLES im Profil "${state.currentProfile}" zurücksetzen? Andere Profile bleiben unberührt.`)) return;
  state.checked = {};
  state.collapsed = {};
  state.expanded = {};
  save();
  render();
};

/* ============================================================
   PROFIL-HANDLER
   ============================================================ */
window.toggleProfilePanel = function(e) {
  if (e) e.stopPropagation();
  state.profilePanelOpen = !state.profilePanelOpen;
  render();
  if (state.profilePanelOpen) {
    setTimeout(() => {
      const input = document.getElementById('profile-new-input');
      if (input) input.focus();
    }, 50);
  }
};

window.switchProfile = function(name) {
  if (!name || !state.profiles.includes(name)) return;
  save();  // aktuellen State speichern
  state.currentProfile = name;
  loadProfile(name);
  saveMeta();
  state.profilePanelOpen = false;
  state.expanded = {};
  render();
};

window.createProfile = function(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('profile-new-input');
  if (!input) return;
  const name = sanitizeProfileName(input.value);
  if (!name) {
    input.focus();
    return;
  }
  if (state.profiles.includes(name)) {
    alert(`Profil "${name}" existiert bereits.`);
    input.focus();
    return;
  }
  save();  // aktuellen State speichern
  state.profiles.push(name);
  state.currentProfile = name;
  // Leeres Profil initialisieren
  state.checked = {};
  state.collapsed = {};
  state.expanded = {};
  state.path = "all";
  state.search = "";
  save();
  saveMeta();
  state.profilePanelOpen = false;
  render();
};

window.deleteProfile = function(e, name) {
  if (e) e.stopPropagation();
  if (!name || name === state.currentProfile) return;
  if (!confirm(`Profil "${name}" wirklich löschen? Dieser Fortschritt wird unwiderruflich entfernt.`)) return;
  try {
    localStorage.removeItem(STORAGE.profile(name));
  } catch(err) {}
  state.profiles = state.profiles.filter(p => p !== name);
  saveMeta();
  render();
};

// Schließe Profil-Panel bei Klick außerhalb
document.addEventListener('click', (e) => {
  if (!state.profilePanelOpen) return;
  const wrap = e.target.closest('.profile-wrap');
  if (!wrap) {
    state.profilePanelOpen = false;
    render();
  }
});

// Keyboard: ESC to close modal or profile panel
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.openGuide) { closeGuide(); return; }
  if (state.profilePanelOpen) { state.profilePanelOpen = false; render(); }
});

load();
render();
</script>
</body>
</html>
